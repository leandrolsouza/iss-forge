name: Release Maintenance

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/release-maintenance.yml'
      - 'scripts/release-maintenance.js'
      - 'scripts/release.js'
  workflow_run:
    workflows: ['Build and Release']
    types: [completed]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes to release notes and Latest (otherwise preview only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-maintenance
  cancel-in-progress: false

jobs:
  organize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Always use the default branch; never execute code from the triggering tag/PR.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Inspect and organize releases
        shell: bash
        run: |
          args=()
          if [[ "$APPLY_CHANGES" == "true" ]]; then args+=(--apply); fi
          node scripts/release-maintenance.js "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APPLY_CHANGES: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
